[package]
name = "sluice"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Batch and filter log streams for efficient agent monitoring"
repository = "https://github.com/nilket-com/sluice"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
os_pipe = "1.2"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
tempfile = "3"
